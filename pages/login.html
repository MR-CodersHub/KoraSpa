<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In to Your Sanctuary — Kora Spa</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../favicon.svg">
  <meta name="theme-color" content="#2D4A32">
  <meta name="description" content="Access your personalized Kora Spa client sanctuary. Manage treatment reservations, therapist notes, and exclusive botanical rituals.">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    /* ============================================================
       STANDALONE LOGIN PAGE STYLES
       ============================================================ */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--color-ivory);
      color: var(--color-text);
      overflow-x: hidden;
    }

    [data-theme="dark"] body {
      background: #0B130C;
    }

    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 3.5rem;
      position: relative;
    }

    .auth-page-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(143,168,135,0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(201,169,110,0.12) 0%, transparent 40%);
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      z-index: 1;
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.05);
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }

    [data-theme="dark"] .auth-card {
      background: #141f16;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-card-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      color: var(--color-forest-text);
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }

    [data-theme="dark"] .auth-card-title {
      color: var(--color-champagne-light);
    }

    .auth-card-subtitle {
      font-size: 0.92rem;
      color: var(--color-text-muted);
      line-height: 1.5;
      margin-bottom: 0;
    }

    /* Demo Quick-Fill Bar */
    .demo-login-box {
      background: rgba(201,169,110,0.12);
      border: 1px dashed var(--color-champagne);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .demo-login-text {
      font-size: 0.82rem;
      color: var(--color-forest-text);
      line-height: 1.4;
    }

    [data-theme="dark"] .demo-login-text {
      color: var(--color-cream);
    }

    .demo-login-text strong {
      display: block;
      color: var(--color-accent-text);
      font-size: 0.85rem;
    }

    .btn-demo-quick {
      background: var(--color-forest);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 0.45rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .btn-demo-quick:hover {
      background: var(--color-forest-light);
      transform: translateY(-1px);
    }

    [data-theme="dark"] .btn-demo-quick {
      background: var(--color-champagne);
      color: var(--color-dark);
    }

    [data-theme="dark"] .btn-demo-quick:hover {
      background: var(--color-champagne-light);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: start;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-forest-text);
      margin-bottom: 0.4rem;
    }

    [data-theme="dark"] .form-label {
      color: var(--color-cream);
    }

    .form-control {
      width: 100%;
      padding: 0.82rem 1rem;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-white);
      color: var(--color-text);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      box-sizing: border-box;
    }

    [data-theme="dark"] .form-control {
      background: #1a271c;
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--color-text-on-dark);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-champagne);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.2);
    }

    .form-control.error {
      border-color: #d9534f;
    }

    .form-error-msg {
      font-size: 0.8rem;
      color: #d9534f;
      margin-top: 0.35rem;
    }

    /* Password Input with Show/Hide */
    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-wrap .form-control {
      padding-inline-end: 2.75rem;
    }

    .password-toggle-btn {
      position: absolute;
      inset-inline-end: 0.75rem;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color var(--transition-fast);
    }

    .password-toggle-btn:hover {
      color: var(--color-accent-text);
    }

    /* Submit Button */
    .btn-submit-loading {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      height: 3.25rem;
      min-height: 3.25rem;
      max-height: 3.25rem;
      padding: 0 1.75rem;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      box-sizing: border-box;
      line-height: 1;
      overflow: hidden;
      white-space: nowrap;
      margin-top: 0.5rem;
    }

    .btn-submit-loading.is-loading {
      pointer-events: none;
      opacity: 0.85;
    }

    .btn-submit-loading svg,
    .btn-submit-loading .btn-arrow {
      width: 18px !important;
      height: 18px !important;
      min-width: 18px !important;
      min-height: 18px !important;
      max-width: 18px !important;
      max-height: 18px !important;
      flex-shrink: 0 !important;
      display: inline-block !important;
    }

    .btn-submit-loading .btn-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.25rem;
      }
      .auth-card-title {
        font-size: 1.55rem;
      }
      .demo-login-box {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-submit-loading {
        font-size: 0.82rem;
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body data-page="login">

  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- MINIMAL UTILITY HEADER -->
  <header class="utility-header">
    <div class="utility-header-container container">
      <a href="../index.html" class="nav-logo" aria-label="Kora Spa — Return to Home">
        <svg class="nav-logo-mark" viewBox="14 34 52 37" fill="none" aria-hidden="true">
          <g fill="currentColor">
            <path d="M40 66c-11-7-17-18-13-29 5 6 9 11 13 16 4-5 8-10 13-16 4 11-2 22-13 29z"/>
            <path d="M40 68c-14-3-22-13-22-25 8 4 16 12 22 20 6-8 14-16 22-20 0 12-8 22-22 25z" opacity="0.5"/>
          </g>
        </svg>
        <span class="nav-logo-stack">
          <span class="nav-logo-name">Kora Spa</span>
          <span class="nav-logo-tagline">Serenity, Elevated.</span>
        </span>
      </a>
      <div class="utility-header-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="dir-toggle" aria-label="Toggle RTL/LTR"><span class="dir-label">RTL</span></button>
      </div>
    </div>
  </header>

  <!-- MAIN LOGIN CONTENT -->
  <main class="auth-page-wrapper" id="main-content">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Sign In to Your Sanctuary</h1>
        <p class="auth-card-subtitle">Enter your registered email and password to access your dashboard.</p>
      </div>

      <!-- DEMO LOGIN QUICK-FILL BAR -->
      <div class="demo-login-box">
        <div class="demo-login-text">
          <strong>Quick Demo Access</strong>
          <span>Pre-load demo credentials for Alexandra Rivers.</span>
        </div>
        <button type="button" class="btn-demo-quick" id="btnQuickDemoLogin">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Demo Login
        </button>
      </div>

      <!-- Alert Banner -->
      <div id="loginAlertBox" class="alert-box" style="display:none; margin-bottom:1.5rem; padding:0.9rem 1.1rem; border-radius:var(--radius-md); font-size:0.88rem;"></div>

      <!-- LOGIN FORM -->
      <form id="clientLoginForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address <span class="text-champagne">*</span></label>
          <input type="email" id="loginEmail" class="form-control" placeholder="e.g. alexandra@example.com" autocomplete="email" required>
          <div class="form-error-msg" id="loginEmailError" style="display:none;"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
            <label for="loginPassword" class="form-label" style="margin-bottom:0;">Password <span class="text-champagne">*</span></label>
            <a href="#" id="forgotPassLink" class="text-champagne" style="font-size:0.82rem; text-decoration:none;">Forgot Password?</a>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility('loginPassword', this)">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-error-msg" id="loginPasswordError" style="display:none;"></div>
        </div>

        <!-- Remember Me -->
        <div class="form-group" style="display:flex; align-items:center; justify-content:space-between;">
          <label class="form-check" style="cursor:pointer; display:flex; align-items:center; gap:0.5rem; font-size:0.88rem;">
            <input type="checkbox" id="loginRememberMe" class="form-check-input" checked>
            <span class="form-check-label">Remember my device</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginSubmitBtn" class="btn-primary btn-submit-loading">
          <span class="btn-text">Enter Sanctuary Portal</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <!-- Bottom Link to Signup -->
        <p style="text-align:center; font-size:0.88rem; color:var(--color-text-muted); margin-top:1.5rem; margin-bottom:0;">
          New to Kora Spa?
          <a href="signup.html" class="text-champagne font-weight-600" style="text-decoration:none;">Create an account here</a>.
        </p>
      </form>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/animations.js"></script>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.innerHTML = isPass
        ? '<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof ThemeManager !== 'undefined') ThemeManager.init();

      // Quick Demo Button
      const demoBtn = document.getElementById('btnQuickDemoLogin');
      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          document.getElementById('loginEmail').value = 'alexandra@example.com';
          document.getElementById('loginPassword').value = 'Serenity2026!';
          if (typeof showToast === 'function') {
            showToast('Loaded demo credentials for Alexandra Rivers', 'info');
          }
        });
      }

      // Forgot Password helper
      const forgotPass = document.getElementById('forgotPassLink');
      if (forgotPass) {
        forgotPass.addEventListener('click', (e) => {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value.trim();
          if (!email) {
            alert('Please enter your email address in the field above to receive a password reset link.');
            document.getElementById('loginEmail').focus();
          } else {
            alert(`A password recovery token has been sent to: ${email}`);
          }
        });
      }

      // Login Form Submission
      const loginForm = document.getElementById('clientLoginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const emailInput = document.getElementById('loginEmail');
          const passInput = document.getElementById('loginPassword');
          const emailErr = document.getElementById('loginEmailError');
          const passErr = document.getElementById('loginPasswordError');
          const loginSubmit = document.getElementById('loginSubmitBtn');

          let valid = true;
          const emailVal = emailInput.value.trim();
          const passVal = passInput.value;

          if (!emailVal || (typeof validateEmail === 'function' && !validateEmail(emailVal))) {
            emailErr.textContent = 'Please provide a valid email address.';
            emailErr.style.display = 'block';
            emailInput.classList.add('error');
            valid = false;
          } else {
            emailErr.style.display = 'none';
            emailInput.classList.remove('error');
          }

          if (!passVal) {
            passErr.textContent = 'Password is required.';
            passErr.style.display = 'block';
            passInput.classList.add('error');
            valid = false;
          } else {
            passErr.style.display = 'none';
            passInput.classList.remove('error');
          }

          if (!valid) return;

          loginSubmit.classList.add('is-loading');
          loginSubmit.disabled = true;
          loginSubmit.innerHTML = `
            <span class="spinner" style="width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 0.7s linear infinite;"></span>
            <span>Authenticating Sanctuary Pass...</span>
          `;

          setTimeout(() => {
            if (typeof Auth !== 'undefined') {
              Auth.login(emailVal, passVal);
            }
            if (typeof showToast === 'function') {
              showToast('Welcome back to Kora Spa! Entering sanctuary...', 'success');
            }
            setTimeout(() => {
              const urlParams = new URLSearchParams(window.location.search);
              const redirect = urlParams.get('redirect');
              window.location.href = redirect || 'dashboard.html';
            }, 800);
          }, 850);
        });
      }
    });
  </script>
</body>
</html>
